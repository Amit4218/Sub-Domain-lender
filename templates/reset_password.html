{% extends "base.html" %} {% block content %}
  <div class="flex justify-center items-center m-[9rem]">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 ">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Reset Password</h1>
        <p class="text-sm text-gray-500 mt-1">Enter you'r new password</p>
      </div>

      {% if error %}
      <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-sm text-red-700 font-medium">{{ error }}</p>
      </div>
      {% endif %}

      <div id="error" class="text-sm text-red-700 font-medium"></div>
      <!-- reset-password Form -->
      <form method="POST" id="auth-form" action="/reset_password?token={{data["token"]}}&id={{data["id"]}}" class="space-y-4">
        <div>
          <label for="new_password" class="block text-sm font-medium text-gray-700">
            New Password
          </label>
          <input
            id="new_password"
            name="new_password"
            type="password"
            required
            class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            placeholder="••••••••"
          />
        </div>

        
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-700">
            Confirm Password
          </label>
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            required
            class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            placeholder="••••••••"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
        >
          Reset
        </button>
      </form>
    </div>
  </div>
  {% endblock content %}
</div>
